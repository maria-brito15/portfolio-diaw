<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfólio de Maria Eduarda de Paula Brito — estudante de Engenharia de Software, back-end, arquitetura de software e SDD." />
    <meta name="theme-color" content="#e8ebe2" />
    <title>Maria Eduarda Brito — Portfólio</title>
    <script>
      // Força buscar a versão mais recente: sem ?t=, recarrega uma vez com ?t=<timestamp> (preserva o #/rota).
      (function () {
        var u = new URL(location.href);
        if (!u.searchParams.has('t')) {
          u.searchParams.set('t', Date.now());
          location.replace(u.toString());
        }
      })();
    </script>
    <script>
      (function () {
        var h = location.hash.replace('#/', '');
        var map = { projetos: 'projetos', experiencias: 'experiencias', contato: 'contato' };
        document.documentElement.dataset.page = map[h] || 'sobre';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
